[package]
name = "blackfox"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "init"
path = "./src/init.rs"

[[bin]]
name = "fox"
path = "./src/fox.rs"

[dependencies]
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
liblk = "1.0.1"
nix = { version = "0.31.3", features = ["fs", "mount", "process"] }
